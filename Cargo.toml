[package]
name = "rsborg"
version = "0.2.0"
edition = "2024"
authors = ["MrTomatePNG <mrtomate360@outlook.com>"]
description = "A modern, fast, and ergonomic Terminal User Interface (TUI) for BorgBackup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/GabrielSantarem/rsborg"
homepage = "https://github.com/GabrielSantarem/rsborg"
keywords = ["borg", "backup", "tui", "ratatui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "rsborg"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
